<title>Yeshiva Campaign Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --navy: #0a1a4f;
  --royal: #2346c9;
  --sky: #a9d6f7;
  --teal: #2fc4bb;
  --sun: #ffd23f;
  --sun-ink: #231a00;
  --bg: #f3f6fc;
  --card: #ffffff;
  --ink: #0f1b3d;
  --muted: #5a6785;
  --line: #dde5f3;
  --brand: #2346c9;
  --brand-ink: #ffffff;
  --accent-text: #1b3aa8;
  --ok: #17734a;
  --bad: #b3261e;
  --chip: #eaf0fb;
  --shadow: 0 1px 2px rgba(10, 26, 79, .06), 0 10px 30px rgba(10, 26, 79, .08);
  --radius: 16px;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", "Noto Sans Hebrew", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #070f2b; --card: #101b45; --ink: #eef2ff; --muted: #a2b0d6; --line: #22316a;
    --brand: #6f93ff; --brand-ink: #071033; --accent-text: #9db8ff; --chip: #16255a;
    --ok: #5ed39b; --bad: #ff8b82;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
    --bg: #070f2b; --card: #101b45; --ink: #eef2ff; --muted: #a2b0d6; --line: #22316a;
    --brand: #6f93ff; --brand-ink: #071033; --accent-text: #9db8ff; --chip: #16255a;
    --ok: #5ed39b; --bad: #ff8b82;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 76px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); }
a { color: var(--accent-text); }
h1, h2, h3 { font-family: var(--display); line-height: 1.12; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.wrap { max-width: 1160px; margin: 0 auto; padding: 0 20px; }
.skip { position: absolute; inset-inline-start: -999px; }
.skip:focus { inset-inline-start: 12px; top: 12px; z-index: 100; background: var(--card); padding: 8px 12px; border-radius: 8px; }

/* banners */
.banner { text-align: center; padding: 8px 16px; font-size: 14px; font-weight: 700; }
.banner.demo { background: #fff3c4; color: #5a4300; }
.banner.test { background: #d9ecff; color: #0b3a66; }

/* nav */
.nav { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.nav .wrap { display: flex; align-items: center; gap: 18px; height: 64px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-family: var(--display); font-weight: 800; font-size: 18px; }
.logo .mark { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: #fff; font-size: 20px; background: linear-gradient(135deg, var(--royal), var(--teal)); }
.nav-links { display: none; gap: 4px; margin-inline-start: 12px; }
@media (min-width: 820px) { .nav-links { display: flex; } }
.nav-links a { text-decoration: none; color: var(--muted); font-weight: 700; font-size: 15px; padding: 8px 12px; border-radius: 10px; }
.nav-links a:hover { background: var(--chip); color: var(--ink); }
.nav-end { margin-inline-start: auto; display: flex; align-items: center; gap: 10px; }
.langs { display: flex; gap: 4px; }
.langs button { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 5px 11px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700; }
.langs button[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 14px 24px; font: inherit; font-weight: 800; font-size: 17px; cursor: pointer; text-decoration: none; background: var(--sun); color: var(--sun-ink); box-shadow: 0 2px 0 rgba(0,0,0,.12); transition: transform .12s, filter .12s; }
.btn:hover { filter: brightness(1.04); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
.btn.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); box-shadow: none; font-weight: 700; font-size: 15px; padding: 10px 16px; }
.btn.primary { background: var(--royal); color: #fff; box-shadow: none; }
.btn.small { font-size: 14px; padding: 9px 16px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn.lg { font-size: 19px; padding: 17px 28px; }

/* hero */
.hero { position: relative; color: #fff; background: var(--navy); overflow: hidden; }
.hero-bg { position: absolute; inset: 0; }
.hero-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, rgba(8,20,70,.92) 0%, rgba(8,20,70,.72) 45%, rgba(8,20,70,.35) 100%); }
[dir="rtl"] .hero-bg::after { background: linear-gradient(260deg, rgba(8,20,70,.92) 0%, rgba(8,20,70,.72) 45%, rgba(8,20,70,.35) 100%); }
.carousel { position: absolute; inset: 0; }
.carousel img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 35%; opacity: 0; }
.carousel img.on { opacity: 1; }
@media (prefers-reduced-motion: no-preference) { .carousel img { transition: opacity 1.2s ease; } }
.dots { position: absolute; inset-inline: 0; bottom: 56px; display: flex; justify-content: center; gap: 8px; z-index: 2; }
.dots button { width: 10px; height: 10px; padding: 0; border-radius: 50%; border: 1px solid #fff; background: rgba(255,255,255,.35); cursor: pointer; }
.dots button[aria-current="true"] { background: #fff; }
.hero-in { position: relative; z-index: 1; display: grid; gap: 28px; align-items: center; padding-block: 44px 56px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .hero-in { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 48px; padding-block: 72px 88px; } }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--sky); }
.eyebrow::before { content: ""; width: 28px; height: 3px; border-radius: 2px; background: var(--teal); }
.hero h1 { font-size: clamp(34px, 6vw, 62px); margin: 12px 0 14px; font-weight: 800; }
.hero .lede { font-size: clamp(16px, 2vw, 19px); color: #d6e3fb; max-width: 560px; margin: 0 0 22px; }
.hero-cta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.btn.ghost { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.4); box-shadow: none; font-size: 16px; backdrop-filter: blur(4px); }
.countdown { display: inline-flex; gap: 10px; margin-top: 26px; flex-wrap: wrap; }
.countdown .u { min-width: 66px; text-align: center; padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); }
.countdown b { display: block; font: 800 24px var(--display); font-variant-numeric: tabular-nums; }
.countdown span { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--sky); }

/* goal card */
.goalcard { background: var(--card); color: var(--ink); border-radius: 20px; padding: 26px; box-shadow: 0 24px 60px rgba(3, 10, 40, .45); display: grid; gap: 14px; }
.goalcard .label { font-size: 12px; font-weight: 800; letter-spacing: .12em; color: var(--muted); }
.goalcard .big { font: 800 clamp(40px, 6vw, 58px)/1 var(--display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: var(--navy); }
@media (prefers-color-scheme: dark) { .goalcard .big { color: #fff; } }
.goalcard .sub { color: var(--muted); font-weight: 600; font-size: 14px; }
.bar { position: relative; height: 14px; border-radius: 999px; background: var(--chip); overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; display: block; background: linear-gradient(90deg, var(--royal), var(--teal)); border-radius: 999px; }
[dir="rtl"] .bar > i { inset: 0 0 0 auto; }
.bar > i.matched { background: var(--sun); }
.bar.small { height: 9px; min-width: 120px; }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .8s cubic-bezier(.2,.8,.2,1); } }
.pct { display: flex; justify-content: space-between; font-weight: 800; }
.pct span:last-child { color: var(--muted); font-weight: 600; }
.mrow { display: flex; gap: 10px; align-items: center; background: color-mix(in srgb, var(--sun) 22%, transparent); border-radius: 12px; padding: 10px 12px; font-size: 14px; font-weight: 600; }
.mrow b { font-variant-numeric: tabular-nums; }
.trophy { font-weight: 800; color: #9a6b00; background: color-mix(in srgb, var(--sun) 30%, transparent); padding: 6px 12px; border-radius: 999px; justify-self: start; font-size: 13px; }
.card-actions { display: grid; gap: 10px; }
.card-actions .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.secure { display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--muted); font-size: 12px; }

/* ticker */
.ticker { background: var(--navy); color: #cfe0ff; overflow: hidden; border-top: 1px solid rgba(255,255,255,.1); }
.ticker .track { display: flex; gap: 40px; width: max-content; padding: 11px 0; font-size: 14px; font-weight: 600; }
@media (prefers-reduced-motion: no-preference) { .ticker .track { animation: slide 60s linear infinite; } .ticker:hover .track { animation-play-state: paused; } }
@keyframes slide { to { transform: translateX(-50%); } }
[dir="rtl"] .ticker .track { animation-direction: reverse; }
.ticker b { color: #fff; }
.ticker .amt { color: var(--sun); font-weight: 800; }
.ticker .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--teal); margin-inline-end: 8px; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 28px; }
@media (min-width: 800px) { .stats { grid-template-columns: repeat(4, 1fr); } }
.stat { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; border: 1px solid var(--line); }
.stat b { display: block; font: 800 30px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; font-weight: 700; }

/* sections */
.section { padding: 56px 0 8px; }
.section-h { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.section-h h2 { font-size: clamp(26px, 4vw, 36px); }
.section-h p { color: var(--muted); margin: 6px 0 0; }
.story { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .story { grid-template-columns: 1.1fr 1fr; align-items: start; } }
.story .prose p { margin: 0 0 14px; font-size: 17px; color: var(--ink); }
.levels { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 560px) { .levels { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.level { text-align: start; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; cursor: pointer; font: inherit; color: var(--ink); transition: border-color .15s, transform .15s, box-shadow .15s; }
.level:hover { border-color: var(--royal); transform: translateY(-2px); box-shadow: var(--shadow); }
.level b { display: block; font: 800 24px var(--display); }
.level span { color: var(--muted); font-size: 13px; font-weight: 600; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }

/* tabs */
.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); margin: 0 0 18px; overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 13px 18px; font: inherit; font-weight: 800; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--royal); }
.tabs .count { background: var(--chip); color: var(--muted); font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 999px; margin-inline-start: 8px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
.toolbar input[type="search"] { flex: 1 1 220px; }
.sorts { display: flex; gap: 6px; background: var(--chip); padding: 4px; border-radius: 12px; }
.sorts button { background: none; border: 0; color: var(--muted); font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; padding: 6px 12px; border-radius: 9px; }
.sorts button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(10,26,79,.12); }

.wall { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 640px) { .wall { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 960px) { .wall { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.donor { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 12px; padding: 16px; transition: transform .15s; }
.donor:hover { transform: translateY(-2px); }
.avatar { width: 46px; height: 46px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 15px; background: linear-gradient(135deg, var(--royal), var(--teal)); }
.avatar.anon { background: var(--muted); }
.donor .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.donor .who { font-weight: 800; overflow-wrap: anywhere; }
.donor .amt { color: var(--royal); font-weight: 800; font-variant-numeric: tabular-nums; }
@media (prefers-color-scheme: dark) { .donor .amt { color: var(--sun); } }
.donor .with { font-size: 13px; color: var(--muted); }
.donor .msg { margin: 8px 0 0; overflow-wrap: anywhere; }
.donor .ded { margin-top: 8px; font-size: 13px; color: var(--muted); background: var(--chip); border-radius: 8px; padding: 4px 10px; display: inline-block; }
.donor .foot { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 13px; }
.like { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 3px 11px; cursor: pointer; font: inherit; font-size: 14px; }
.like[aria-pressed="true"] { color: var(--bad); border-color: var(--bad); }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }

table.t { width: 100%; border-collapse: collapse; background: var(--card); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); }
table.t th, table.t td { padding: 13px 16px; text-align: start; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t th { font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; background: var(--chip); }
table.t tr:last-child td { border-bottom: 0; }
.scroll-x { overflow-x: auto; }
.rank { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--chip); font-weight: 800; font-size: 13px; margin-inline-end: 8px; }

/* forms */
label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 5px; }
input, select, textarea { width: 100%; font: inherit; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 11px; padding: 11px 13px; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 0; border-color: var(--royal); box-shadow: 0 0 0 4px color-mix(in srgb, var(--royal) 22%, transparent); }
button:focus-visible, a:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
input[type="checkbox"] { width: auto; margin-inline-end: 8px; accent-color: var(--royal); }
.check { display: flex; align-items: flex-start; font-weight: 500; font-size: 14px; }
.grid2 { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 560px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.stack { display: grid; gap: 14px; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.err { color: var(--bad); font-weight: 700; font-size: 14px; }
.ok { color: var(--ok); font-weight: 700; }
.note { color: var(--muted); font-size: 13px; }
.center { text-align: center; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px; padding: 9px 16px; cursor: pointer; font: inherit; font-weight: 800; }
.chip:hover { border-color: var(--royal); }
.chip[aria-pressed="true"] { background: var(--royal); color: #fff; border-color: var(--royal); }
.amount-in { position: relative; }
.amount-in input { font: 800 28px var(--display); padding-inline-start: 38px; }
.amount-in .sym { position: absolute; inset-inline-start: 14px; top: 50%; transform: translateY(-50%); font: 800 24px var(--display); color: var(--muted); pointer-events: none; }
.matchbox { background: color-mix(in srgb, var(--sun) 24%, transparent); border-radius: 12px; padding: 10px 14px; font-weight: 700; font-size: 14px; }
.fieldset-title { font: 800 17px var(--display); margin-top: 6px; }

/* modal */
dialog { border: 0; border-radius: 22px; padding: 0; width: min(880px, calc(100vw - 20px)); max-height: calc(100dvh - 20px); background: var(--card); color: var(--ink); box-shadow: 0 30px 80px rgba(2, 8, 36, .5); overflow: hidden; }
dialog::backdrop { background: rgba(5, 12, 45, .65); backdrop-filter: blur(3px); }
.modal { display: grid; grid-template-columns: minmax(0, 1fr); max-height: calc(100dvh - 20px); }
@media (min-width: 820px) { .modal { grid-template-columns: 300px minmax(0, 1fr); } }
.modal-side { display: none; position: relative; color: #fff; background: var(--navy); }
@media (min-width: 820px) { .modal-side { display: block; } }
.modal-side img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 40%; opacity: .55; }
.modal-side .in { position: relative; padding: 28px 24px; display: grid; gap: 12px; align-content: end; height: 100%; background: linear-gradient(180deg, rgba(8,20,70,.2), rgba(8,20,70,.92)); }
.modal-side h3 { font-size: 24px; }
.modal-side p { margin: 0; color: #cfe0ff; font-size: 14px; }
.modal-main { overflow-y: auto; max-height: calc(100dvh - 20px); }
.modal-h { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); z-index: 1; }
.modal-h h2 { font-size: 22px; }
.modal-b { padding: 22px 24px 26px; }
.x { border: 0; background: none; font-size: 28px; cursor: pointer; color: var(--muted); line-height: 1; }

.share { position: fixed; inset-block-end: 18px; inset-inline-end: 18px; z-index: 5; box-shadow: var(--shadow); }
.page { padding: 36px 0 90px; }
.footer { background: var(--navy); color: #b9c8f0; margin-top: 70px; padding: 40px 0; font-size: 14px; }
.footer a { color: #fff; }
.footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; }
.pill { display: inline-block; font-size: 12px; font-weight: 800; border-radius: 999px; padding: 2px 10px; background: var(--chip); }
.pill.ok { background: #d8f2e4; color: #14532d; }
.pill.bad { background: #fbd9d6; color: #7a1610; }
.pill.warn { background: #fff1c2; color: #5a4300; }
.admin-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
.admin-tabs a { text-decoration: none; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); font-weight: 700; }
.admin-tabs a[aria-current="page"] { background: var(--royal); color: #fff; border-color: var(--royal); }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 18px; }
.kpi .v { font: 800 26px var(--display); }
.kpi .l { color: var(--muted); font-size: 13px; }

body{padding-bottom:0}
.pv{background:#0a1a4f;color:#cfe0ff;font-size:13px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;padding:7px 16px}
.pv b{color:#fff;letter-spacing:.06em}

// ---- persistence (shared db when the viewer can write; otherwise stays on this screen)
function rid(){return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function saveGift(g){g.id=rid();S.localGifts.push(g);var o=Object.assign({},g);if(S.db){S.db.collection("gifts").doc(g.id).set(o).catch(function(){flash("Saved on this screen only (this viewer can't write shared data).")})}else flash("Saved on this screen only.")}
function saveTeam(d){d.id=rid();S.localTeams.push(d);if(S.db){S.db.collection("teams").doc(d.id).set(d).catch(function(){flash("Saved on this screen only.")})}}
function like(id){if(liked(id))return;S.localLikes[id]=true;if(S.db&&S.uid){S.db.collection("likes").doc(id+"__"+S.uid).set({g:id,uid:S.uid}).catch(function(){})}renderWall()}
function approve(id){var d=S.localTeams.filter(function(x){return x.id===id})[0];if(d)d.approved=true;if(S.db){S.db.collection("teams").doc(id).update({approved:true}).catch(function(){flash("Only editors of this page can approve teams.")})}render()}
